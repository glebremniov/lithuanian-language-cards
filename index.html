<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Карточки для запоминания литовских слов и фраз с русским переводом.">
    <title>Карточки литовского языка</title>
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem("cards-theme") || "system"; } catch {}
    </script>
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
  </head>
  <body>
    <p id="load-status" class="load-status" role="status">Загрузка слов…</p>
    <div id="app-shell" class="app-shell" hidden>
      <aside class="sidebar" aria-label="Темы">
        <h2>Темы</h2>
        <nav id="topic-list" class="topic-list" aria-label="Выбрать тему"></nav>
      </aside>

      <main class="study-area" aria-label="Карточки литовского языка">
        <section class="study-content">
          <div class="top-controls">
            <div class="theme-control" role="group" aria-label="Оформление">
              <button id="theme-system" type="button" class="theme-button" aria-label="Системная тема" title="Системная тема" aria-pressed="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8M12 18v4"/></svg>
              </button>
              <button id="theme-light" type="button" class="theme-button" aria-label="Дневная тема" title="Дневная тема" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              </button>
              <button id="theme-dark" type="button" class="theme-button" aria-label="Ночная тема" title="Ночная тема" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 15.6A8.5 8.5 0 0 1 8.4 3.8 8.5 8.5 0 1 0 20.2 15.6Z"/></svg>
              </button>
            </div>
            <div class="mobile-topic-picker">
              <label for="topic-select">Тема</label>
              <select id="topic-select"></select>
            </div>
          </div>

          <div class="session-head">
            <h1 id="current-topic"></h1>
            <button id="shuffle-button" class="text-button" type="button">Перемешать</button>
          </div>

          <div class="progress-row">
            <span id="progress-text"></span>
            <span id="card-position"></span>
          </div>
          <div class="progress-track" role="progressbar" aria-label="Выучено в теме" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar"><span id="progress-fill"></span></div>

          <div class="view-switch" role="group" aria-label="Вид слов">
            <button id="view-cards" type="button" class="active" aria-pressed="true">Карточки</button>
            <button id="view-list" type="button" aria-pressed="false">Все слова</button>
          </div>

          <div id="card-pane">
            <div class="mode-switch" role="group" aria-label="Режим карточек">
              <button id="mode-study" type="button" class="active" aria-pressed="true">Учу <span id="study-count"></span></button>
              <button id="mode-known" type="button" aria-pressed="false">Выучены <span id="known-count"></span></button>
            </div>

            <div id="card-stage" class="card-stage">
              <button id="flashcard" class="flashcard" type="button" aria-label="Показать перевод">
                <span id="card-side-label" class="card-side-label">Литовский</span>
                <span class="card-center">
                  <span id="card-word" class="card-word"></span>
                  <span id="card-question" class="card-question"></span>
                </span>
              </button>
              <div id="empty-state" class="empty-state" hidden>
                <h3 id="empty-title"></h3>
                <button id="empty-action" class="primary-button" type="button"></button>
              </div>
            </div>

            <div id="card-actions" class="card-actions">
              <button id="previous-button" class="round-button" type="button" aria-label="Предыдущая карточка">←</button>
              <div class="answer-actions">
                <button id="reveal-button" class="primary-button" type="button">Показать перевод</button>
                <button id="again-button" class="secondary-button" type="button" hidden>Ещё раз</button>
                <button id="known-button" class="primary-button" type="button" hidden>Знаю</button>
                <button id="return-button" class="secondary-button" type="button" hidden>Вернуть в учёбу</button>
              </div>
              <button id="next-button" class="round-button" type="button" aria-label="Следующая карточка">→</button>
            </div>
          </div>

          <section id="word-list" class="word-list" aria-label="Все слова темы" hidden>
            <table>
              <thead><tr><th scope="col">Литовский</th><th scope="col">Перевод</th></tr></thead>
              <tbody id="word-list-rows"></tbody>
            </table>
          </section>
        </section>
      </main>
    </div>
  </body>
</html>
